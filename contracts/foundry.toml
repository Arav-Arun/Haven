# Cloakroom contracts (Person A). DriveRegistry builds on ENSv2 at ensdomains/contracts-v2@48b3e2d,
# vendored as the git submodule lib/contracts-v2. Its own dependencies live under
# lib/contracts-v2/contracts/lib/ and are mapped in remappings.txt.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"   # satisfies every pragma in ENSv2 src (>=0.8.13 … ^0.8.25)
evm_version = "cancun"    # same as ENSv2
optimizer = true
optimizer_runs = 200
auto_detect_remappings = false  # only remappings.txt; nested libs would otherwise add conflicting ones
ignored_warnings_from = ["lib/"]

[fuzz]
runs = 1024

[lint]
lint_on_build = false
