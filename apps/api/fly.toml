# Haven API on Fly.io. Secrets (never in this file):
#   fly secrets set --config apps/api/fly.toml SEPOLIA_RPC_URL=… RELAYER_PRIVATE_KEY=… ARKIV_ACCESS_KEY=… \
#     POSTAGE_BATCH_ID=… BEE_URL=http://haven-bee.internal:1633
app = "havenethglobal-api"
primary_region = "sin"
# Swap on the machine's disk: a burst (a 16 MB padded upload held in memory) slows down instead of being killed
# for running out of memory on the 256 MB machine.
swap_size_mb = 1024

[env]
  PORT = "8787"
  # Keep the JavaScript heap small, so garbage is collected before the machine runs short.
  NODE_OPTIONS = "--max-old-space-size=160"
  ARKIV_RPC_URL = "https://rpc.rabdi.db-chain.testnet.arkiv.network"
  # Log searches for browsers (/sepolia-rpc): providers without a tight eth_getLogs block-range cap, best first.
  SEPOLIA_LOGS_RPC_URL = "https://sepolia.gateway.tenderly.co,https://ethereum-sepolia-rpc.publicnode.com"
  ROOM_POW_DIFFICULTY = "20"
  DRIP_SEPOLIA_WEI = "1000000000000000"
  DRIP_ARKIV_WEI = "20000000000000000"
  # The plan says 600. 5 keeps sign-up and new rooms fast; drips are still sent together, never one by one.
  DRIP_BATCH_SECONDS = "5"
  # Add-on F4: leading bits a doorbell chunk address shares with our Bee node (bee-js default for GSOC mining).
  DOORBELL_PROXIMITY = "12"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
