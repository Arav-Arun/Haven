# Fly.io app for the Cloakroom API. Deploy from apps/api: `pnpm --filter @cloakroom/api deploy`.
# Secrets (never in this file): fly secrets set RELAYER_PRIVATE_KEY=… SEPOLIA_RPC_URL=… ARKIV_ACCESS_KEY=… \
#   BEE_URL=… POSTAGE_BATCH_ID=…   (optional: DRIP_SEPOLIA_WEI, DRIP_ARKIV_WEI, ROOM_POW_DIFFICULTY, caps)
app = "cloakroom-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpus = 1
