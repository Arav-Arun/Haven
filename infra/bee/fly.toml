# Our own Bee light node (only if the Swarm team doesn't give us an upload node). Private: no public service, so only
# the API reaches it, at http://haven-bee.internal:1633. Anyone who could reach a Bee API could spend our batch.
#   fly apps create haven-bee
#   fly volumes create bee_data --config infra/bee/fly.toml --region sin --size 10
#   fly secrets set --config infra/bee/fly.toml BEE_PASSWORD=… BEE_BLOCKCHAIN_RPC_ENDPOINT=https://rpc.gnosischain.com
#   fly deploy --config infra/bee/fly.toml
# Then fund the node's Gnosis address (GET /addresses → ethereum) with a little xDAI (gas for its chequebook and the
# batch) and xBZZ, and buy ONE batch. Depth 19 = 112 MB usable (enough for the site copy and demo files); cost is
# 2^depth × amount PLUR (1 xBZZ = 1e16 PLUR), and amount = live price × 17280 blocks/day × days. Read the live price
# first (GET /chainstate → currentPrice); the contract refuses less than 1 day (minimumValidityBlocks = 17280). At
# 201172 PLUR/chunk/block (2026-11-06), 7 days at depth 19 is amount 24333765120, about 1.28 xBZZ:
# The image has no wget or curl, so talk to the node through a private tunnel from your own machine:
#   fly proxy 1633:1633 --config infra/bee/fly.toml        (leave running; then, in another terminal)
#   curl http://localhost:1633/chainstate
#   curl -X POST http://localhost:1633/stamps/<amount>/19
# Extend it later instead of buying another: POST /stamps/topup/<batchID>/<amount>.
# The node's key (in the bee_data volume, encrypted with BEE_PASSWORD) owns the batch: keep the password safe, and
# don't delete the volume while the batch is in use.
app = "haven-bee"
primary_region = "sin"

[build]
  image = "ethersphere/bee:2.8.3"

[experimental]
  cmd = ["start"]

[env]
  BEE_API_ADDR = ":1633"
  BEE_FULL_NODE = "false"
  BEE_SWAP_ENABLE = "true"
  BEE_MAINNET = "true"
  BEE_DATA_DIR = "/home/bee/.bee"
  BEE_CORS_ALLOWED_ORIGINS = ""
  BEE_VERBOSITY = "2"

[mounts]
  source = "bee_data"
  destination = "/home/bee/.bee"

[[vm]]
  memory = "1gb"
  cpus = 1
