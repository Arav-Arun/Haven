packages:
  - "packages/*"
  - "apps/*"

overrides:
  # RainbowKit's QR renderer requires the zero-border support in this version.
  "cuer>qr": 0.5.1

# pnpm 11 blocks install scripts unless allowed here.
allowBuilds:
  esbuild: true
  # Only a version check that phones home; not needed to build or run.
  "@reown/appkit": false
  bufferutil: false
  keccak: false
  utf-8-validate: false
